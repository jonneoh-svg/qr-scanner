<!DOCTYPE html>
<html>
<head>
  <title>QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    #reader {
      width: 100vw;
      height: 70vh;
    }

    #result {
      font-size: 20px;
      margin-top: 10px;
    }

    #status {
      font-size: 18px;
      margin-top: 10px;
      color: #aaa;
    }
  </style>
</head>

<body>

<h2>QR Scanner</h2>
<div id="reader"></div>
<div id="result">Waiting for scan...</div>
<div id="status">Ready</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgyxYJSqTAaFsswUTCGe-mwAKteeiK9O28cGkgvBb3Jlkd7Q0m54olUwZmMS-Oflys/exec";

let scanning = true;

function playBeep() {
    const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
    audio.play();
}

function onScanSuccess(decodedText) {
    if (!scanning) return;
    scanning = false;

    document.getElementById("result").innerText = "Scanned: " + decodedText;
    document.getElementById("status").innerText = "Saving...";

    playBeep();

    fetch(SCRIPT_URL + "?data=" + encodeURIComponent(decodedText))
      .then(res => res.text())
      .then(data => {
          console.log("Saved:", data);
          document.getElementById("status").innerText = "✅ Saved";

          // Reset for next scan
          setTimeout(() => {
              scanning = true;
              document.getElementById("status").innerText = "Ready";
          }, 1500);
      })
      .catch(err => {
          console.error(err);
          document.getElementById("status").innerText = "❌ Error";
          scanning = true;
      });
}

function onScanError(errorMessage) {
    // optional logging
    console.log("Scan error:", errorMessage);
}

const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras()
  .then(devices => {
      if (!devices || devices.length === 0) {
          document.getElementById("result").innerText = "No camera found";
          return;
      }

      let cameraId = devices[devices.length - 1].id;

      html5QrCode.start(
          cameraId,
          { fps: 10, qrbox: 250 },
          onScanSuccess,
          onScanError
      );
  })
  .catch(err => {
      document.getElementById("result").innerText = "Camera error: " + err;
  });
</script>

</body>
</html>
