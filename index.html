<!DOCTYPE html>
<html>
<head>
  <title>QR Scanner</title>

  <!-- QR library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    #reader {
      width: 100vw;
      height: 80vh;
    }

    #result {
      margin-top: 10px;
      font-size: 16px;
      padding: 10px;
      word-wrap: break-word;
    }

    #status {
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>

<body>

<h2>QR Scanner</h2>
<div id="reader"></div>
<div id="result">Waiting for scan...</div>
<div id="status"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgyxYJSqTAaFsswUTCGe-mwAKteeiK9O28cGkgvBb3Jlkd7Q0m54olUwZmMS-Oflys/exec";

let scanned = false;

function playBeep() {
    const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
    audio.play();
}

function onScanSuccess(decodedText) {
    if (scanned) return; // prevent multiple scans
    scanned = true;

    document.getElementById("result").innerText = "Scanned: " + decodedText;
    playBeep();

    fetch(SCRIPT_URL + "?data=" + encodeURIComponent(decodedText))
      .then(res => res.text())
      .then(data => {
          console.log("Server response:", data);
          document.getElementById("status").innerText = "✅ Saved to Google Sheets";
      })
      .catch(err => {
          console.error(err);
          document.getElementById("status").innerText = "❌ Error saving data";
      });
}

function onScanError(errorMessage) {
    // optional: log scan errors
    console.log("Scan error:", errorMessage);
}

const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras()
  .then(devices => {
      if (!devices || devices.length === 0) {
          document.getElementById("result").innerText = "❌ No camera found";
          return;
      }

      // Prefer back camera, fallback to last camera
      let cameraId = devices[devices.length - 1].id;

      const backCam = devices.find(d =>
          d.label.toLowerCase().includes("back") ||
          d.label.toLowerCase().includes("environment")
      );

      if (backCam) cameraId = backCam.id;

      html5QrCode.start(
          cameraId,
          {
              fps: 10,
              qrbox: { width: 250, height: 250 }
          },
          onScanSuccess,
          onScanError
      ).catch(err => {
          document.getElementById("result").innerText = "❌ Camera error: " + err;
      });
  })
  .catch(err => {
      document.getElementById("result").innerText = "❌ Camera access failed: " + err;
  });
</script>

</body>
</html>
